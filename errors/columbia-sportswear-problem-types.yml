problem_types:
  - status: 400
    title: Material Number is required
    operation: get-api-external-image-getseasonalassets-materialnumber-materialnumber
    source: openapi
    detail: >-
      Returned by GetSeasonalAssets when the required MaterialNumber query
      parameter is absent.
    remediation: Supply MaterialNumber as a 10-digit product number, e.g. 1442362613.
  - status: 400
    title: Maximum Take size is 1000
    operation: get-api-external-image-getseasonalassetsbulk
    source: openapi
    detail: >-
      Returned by GetSeasonalAssetsBulk when the Take paging parameter exceeds
      1000.
    remediation: Request Take <= 1000 and page with Skip.
  - status: 401
    title: Access denied due to missing subscription key
    source: probed
    detail: >-
      Gateway response when no Ocp-Apim-Subscription-Key header and no
      subscription-key query parameter is present. Accompanied by
      'WWW-Authenticate: AzureApiManagementKey realm="https://api.columbia.com/ContentHubExternal",
      name="Ocp-Apim-Subscription-Key", type="header"'.
    remediation: >-
      Include the subscription key issued through the developer portal on every
      request.
  - status: 401
    title: Access denied due to invalid subscription key
    source: probed
    detail: >-
      Gateway response when a key is present but is not valid for an active
      subscription.
    remediation: >-
      Confirm the subscription is approved and active in the developer portal and
      that the key matches the product granting access to this API.
