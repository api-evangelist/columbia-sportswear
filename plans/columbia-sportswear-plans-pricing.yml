description: >-
  Columbia Sportswear publishes NO price for API access. Its developer portal
  exposes exactly one product anonymously — ContentHub External — and that product
  is an access tier, not a commercial plan: it requires a subscription, requires
  Columbia's approval before a key is issued, and carries no price, quota, overage
  or billing period of any kind. Access is governed by the partner or vendor
  agreement a subscriber already holds with Columbia, not by a published tier.
notes: >-
  plan_count is 1 because one real access tier is published and machine-readable.
  priced_plan_count is 0 because Columbia publishes no price for it. Previous
  rounds of this artifact recorded a generated "Wholesale / Partner Integration"
  plan that Columbia never published; it has been replaced with the tier the
  provider's own catalogue actually returns.
