description: 'Columbia Sportswear is a global designer, marketer, and distributor of outdoor, active,
  and everyday lifestyle apparel, footwear, accessories, and equipment under the Columbia, Mountain Hardwear,
  SOREL, and prAna brands. Columbia Sportswear Digital runs a partner-facing API estate on Microsoft Azure
  API Management: a developer portal at columbia.developer.azure-api.net and a production gateway on Columbia''s
  own domain at api.columbia.com. Exactly one API product is documented anonymously - ContentHub External,
  a read-only product-imagery service with a published OpenAPI 3.0.1 contract - and every other product
  on the portal requires sign-in. Access is a partner arrangement rather than a developer program: subscriptions
  require Columbia''s approval, portal terms restrict use to Columbia employees and to vendors serving
  Columbia under agreement, and no price, rate limit, SLA or status page is published. The company also
  exchanges traditional EDI documents (POs, ASNs, invoices) with retail trading partners through providers
  like TrueCommerce and eZCom.'
